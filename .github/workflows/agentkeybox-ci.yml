name: AgentKeybox CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit -p apps/cli/tsconfig.json
      - run: npm test --workspace @bitwarden/cli -- --runInBand src/agentkeybox
      - run: npm run build:akb --workspace @bitwarden/cli
      - run: node apps/cli/build-akb/akb.js --version
